<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6fb">
<title>NOVA SWIM · Training</title>

<style>
:root{
  --paper:#f7f6fb;--white:#fff;--ink:#17171c;--muted:#85838d;
  --line:#e8e7ee;--accent:#b9a4ff;--accent-soft:#f2edff;
  --accent-ink:#59469a;--green:#45bd83;
  --shadow:0 18px 55px rgba(30,25,50,.12)
}
*{box-sizing:border-box}
html{background:var(--paper);scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  letter-spacing:-.018em;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overscroll-behavior-y:contain;
  -webkit-tap-highlight-color:transparent
}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.5;cursor:not-allowed}
[hidden]{display:none!important}
#screen{min-height:100dvh}
.app-shell{max-width:1440px;margin:auto;padding:14px clamp(14px,5vw,72px) 125px}
.app-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 22px;min-height:46px}
.brand{font-size:21px;font-weight:760;letter-spacing:-.06em}
.top-actions{display:flex;align-items:center;gap:10px}
.round-icon{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;color:var(--ink);
  transition:background .25s,box-shadow .25s
}
.round-icon:hover{background:var(--accent-soft);box-shadow:0 5px 16px rgba(90,70,150,.1)}
.round-icon:active{transform:none}
.round-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.round-icon:hover svg{animation:gearTurn .7s ease}
.page{animation:pageIn .38s ease both}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes gearTurn{from{transform:rotate(0)}to{transform:rotate(90deg)}}
.eyebrow{font-size:9px;letter-spacing:.14em;font-weight:750;color:var(--muted);text-transform:uppercase}
.page h1{font-size:clamp(29px,4vw,39px);line-height:1.08;letter-spacing:-.05em;font-weight:740;margin:9px 0 10px}
.page h2{font-size:19px;letter-spacing:-.035em;font-weight:690;margin:0 0 10px}
.page h3{font-size:15px;letter-spacing:-.025em;font-weight:680;margin:0 0 7px}
.page p{font-size:13px;line-height:1.6;color:#686772;margin:6px 0}
.sub{max-width:680px;margin:0 0 24px!important}
.section{margin-top:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:0 5px 22px rgba(35,31,55,.04);min-width:0}
.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.primary,.secondary,.pill{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:999px;padding:12px 18px;font-size:10px;font-weight:750;
  letter-spacing:.045em;border:1px solid transparent;text-decoration:none;
  transition:box-shadow .2s,background .2s
}
.primary{background:var(--accent);color:#17121f;box-shadow:0 5px 15px rgba(185,164,255,.2)}
.secondary,.pill{background:#fff;border-color:var(--line);color:var(--ink)}
.primary:hover,.secondary:hover,.pill:hover{box-shadow:0 8px 20px rgba(20,20,15,.08)}
.primary:active,.secondary:active,.pill:active{transform:none}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:10px;color:var(--muted);font-weight:750}
.tag.accent{background:var(--accent-soft);border-color:#e4dcfa;color:var(--accent-ink)}
.tag.green{background:#e7f6ed;border-color:#d2ecdc;color:#267a4e}
.muted{font-size:11px;color:var(--muted)}
.stat{font-size:26px;font-weight:740;letter-spacing:-.05em;margin:8px 0}
.stat-label{display:block;font-size:9px;letter-spacing:.1em;color:var(--muted);font-weight:750}
.stat-support{display:block;font-size:10px;color:var(--muted);line-height:1.4}
.progress-track{height:6px;border-radius:20px;background:#eeedf3;overflow:hidden;margin:13px 0}
.progress-track i{display:block;height:100%;background:linear-gradient(90deg,#c6b5ff,#9d83f0);border-radius:inherit;transition:width .45s}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.home-hero{background:linear-gradient(135deg,#f1edff 0%,#fff 78%);border:1px solid #e8e1fa;border-radius:25px;padding:25px;overflow:hidden}
.home-hero h1{font-size:clamp(28px,4vw,38px);line-height:1.08;letter-spacing:-.05em;font-weight:740;margin:10px 0}
.home-hero p{max-width:550px;margin:0}
.home-greeting{font-size:13px;color:var(--muted);font-weight:650}
.home-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.home-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.home-stat-grid .card{padding:16px}
.home-stat-grid .stat{font-size:23px}
.home-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.home-week-day{text-align:center;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 3px}
.home-week-day b{display:block;font-size:12px}
.home-week-day small{display:block;font-size:9px;color:var(--muted);margin-top:5px}
.home-week-day i{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:7px auto 0}
.home-week-day.done i{background:var(--green)}
.home-week-day.today{background:var(--accent-soft);border-color:#c9b9ff;color:var(--accent-ink)}
.home-coach-card{display:flex;align-items:center;justify-content:space-between;gap:16px}
.home-coach-card p{margin:5px 0 0}
.activity-card{display:flex;align-items:center;justify-content:space-between;gap:12px}
.competition-list{display:grid;gap:10px}
.competition{display:flex;align-items:center;justify-content:space-between;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.competition:last-child{border-bottom:0;padding-bottom:0}
.competition-date{width:52px;min-width:52px;height:54px;border-radius:15px;background:var(--accent-soft);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.competition-date b{font-size:18px;line-height:1}
.competition-date small{font-size:8px;font-weight:800;margin-top:4px;text-transform:uppercase}
.competition-copy{flex:1;min-width:0}
.competition-copy b{display:block;font-size:12px;line-height:1.35}
.competition-copy small{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.4}
.competition a{font-size:10px;color:var(--accent-ink);font-weight:750;text-decoration:none;white-space:nowrap}
.session-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.session-card{padding:0;overflow:hidden;border-radius:21px;transition:box-shadow .2s}
.session-card:active{transform:none}
.session-card img{display:block;width:100%;height:clamp(140px,20vw,190px);object-fit:cover;background:#e8e6ef}
.session-content{padding:14px}
.session-content h3{font-size:14px;line-height:1.35;margin:5px 0}
.session-content p{font-size:11px;margin:3px 0}
.session-content .flex{margin-top:11px}
.session-status{font-size:9px;color:var(--muted);font-weight:750}
.session-status.complete{color:#278451}
.field{display:grid;gap:8px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.field input,.field select{width:100%;min-width:0;padding:14px 15px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:14px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.survey-section{margin-top:20px}
.survey-section h3{font-size:13px;margin-bottom:10px}
.options{display:flex;gap:8px;flex-wrap:wrap}
.option{background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:10px 14px;font-size:11px;font-weight:680;transition:background .2s,border .2s}
.option.selected{border-color:#b9a4ff;background:var(--accent-soft);color:var(--accent-ink)}
.option:active{transform:none}
.generate-box{background:linear-gradient(135deg,#f1edff,#fff);border:1px solid #e8e1fa;border-radius:22px;padding:20px}
.quota-number{font-size:28px;font-weight:760;letter-spacing:-.05em}
.quota-dots{display:flex;gap:6px;margin-top:12px}
.quota-dots i{width:100%;height:6px;border-radius:20px;background:#e8e3f3}
.quota-dots i.used{background:#b9a4ff}

/* VENTANAS SECUNDARIAS */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(15,16,24,.43);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s}
.modal-backdrop.open{opacity:1;visibility:visible}
.modal-card{width:min(100%,560px);max-height:min(88dvh,820px);overflow-y:auto;overscroll-behavior:contain;background:#fff;border:1px solid var(--line);border-radius:25px;padding:24px;box-shadow:var(--shadow);transform:translateY(12px);opacity:0;transition:transform .25s ease,opacity .25s}
.modal-backdrop.open .modal-card{transform:none;opacity:1}
.modal-backdrop.closing{opacity:0;visibility:hidden}
.modal-backdrop.closing .modal-card{transform:translateY(8px);opacity:0}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:17px}
.modal-head h2{font-size:22px;letter-spacing:-.04em;margin:6px 0}
.modal-head p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.modal-close{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:21px;display:grid;place-items:center;transition:background .2s}
.modal-close:hover{background:var(--accent-soft)}
.modal-close:active{transform:none}
.training-modal-content{width:min(100%,760px)}
.coach-modal{width:min(100%,900px)}
.workout-part{padding:16px 0;border-bottom:1px solid var(--line)}
.workout-part:last-child{border-bottom:0}
.workout-part .part-title{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.part-number{width:27px;height:27px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:10px;font-weight:800}
.workout-part h3{font-size:14px;margin:0}
.workout-part p{font-size:12px;line-height:1.65;margin:0;color:#62616b}
.zone{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font-size:9px;font-weight:800;margin-top:8px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}
.modal-actions button{flex:1}
.schedule-box{background:#f8f7fb;border:1px solid var(--line);border-radius:17px;padding:14px;margin-top:15px}
.schedule-box .field{margin-bottom:11px}
.schedule-box .flex{gap:8px}

/* NAVEGACIÓN */
.navbar{position:fixed;z-index:30;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 20px));padding:6px;background:#17171c;border:1px solid rgba(255,255,255,.12);border-radius:20px;box-shadow:0 12px 38px rgba(25,27,18,.15);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.navbar button{min-width:0;min-height:54px;padding:6px 2px;border:0;background:transparent;color:#d8d8df;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:15px;font-size:8px;font-weight:700;transition:color .22s}
.navbar button.active{color:#e3d9ff;background:transparent}
.navbar button:active{transform:none}
.ico{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* Animaciones exclusivas de los iconos */
.nav-home,.nav-profile,.calendar-clock{transform-origin:center}
.nav-profile{opacity:0;transform:scale(.55)}
.nav-anim-inicio .nav-home{animation:homeDisappear .45s ease forwards}
.nav-anim-inicio .nav-profile{animation:profileAppear .5s .12s ease forwards}
@keyframes homeDisappear{to{opacity:0;transform:scale(.55)}}
@keyframes profileAppear{to{opacity:1;transform:scale(1)}}

.wave-line{transform-box:fill-box;transform-origin:center}
.nav-anim-entrenar .wave-line{animation:waveArrival .8s ease both}
.nav-anim-entrenar .wave-line:nth-of-type(2){animation-delay:.12s}
.nav-anim-entrenar .wave-line:nth-of-type(3){animation-delay:.24s}
@keyframes waveArrival{
  0%{transform:translateX(-9px);opacity:.35}
  45%{transform:translateX(4px);opacity:1}
  75%{transform:translateX(-2px)}
  100%{transform:translateX(0);opacity:1}
}

.calendar-clock{opacity:0;transform:scale(.4)}
.nav-anim-calendario .calendar-clock{animation:clockAppear .65s ease forwards}
@keyframes clockAppear{
  0%{opacity:0;transform:scale(.35) rotate(-45deg)}
  65%{opacity:1;transform:scale(1.13) rotate(8deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}

.progress-bar{transform-box:fill-box;transform-origin:bottom}
.nav-anim-progreso .progress-bar{animation:barGrow .65s cubic-bezier(.2,.8,.2,1) both}
.nav-anim-progreso .progress-bar:nth-of-type(2){animation-delay:.08s}
.nav-anim-progreso .progress-bar:nth-of-type(3){animation-delay:.16s}
.nav-anim-progreso .progress-bar:nth-of-type(4){animation:barLastHigh .7s .24s ease both}
@keyframes barGrow{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
@keyframes barLastHigh{from{transform:scaleY(.2)}to{transform:scaleY(1.35)}}

.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.month-head{text-align:center;font-size:10px;color:var(--muted);font-weight:800;padding:9px 0}
.month-day,.month-day-empty{min-height:54px;border:1px solid transparent;background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);font-size:12px}
.month-day.outside{opacity:.3}
.month-day.selected{border-color:#b9a4ff;background:var(--accent-soft);color:var(--accent-ink)}
.month-day.today{box-shadow:inset 0 0 0 1px #b9a4ff}
.month-day i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.month-day.done i{background:var(--green)}
.calendar-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.calendar-legend span{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.calendar-legend i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.calendar-legend .done-dot{background:var(--green)}
.history-row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.history-row:last-child{border:0}

/* PAQUETES */
.plan-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.plan-card{display:flex;flex-direction:column;padding:17px;border-radius:19px;background:#fff;border:1px solid var(--line);min-width:0}
.plan-card h2{font-size:17px;margin-top:9px}
.plan-card .price{font-size:25px;font-weight:750;margin:10px 0;letter-spacing:-.05em}
.plan-card .price small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:3px}
.plan-card p{font-size:11px;line-height:1.5}
.plan-card ul{padding-left:16px;color:#666a64;font-size:10px;line-height:1.7;margin:10px 0 16px}
.plan-card .primary{margin-top:auto;align-self:stretch;padding:11px 10px;font-size:9px}
.coach-intro{background:linear-gradient(135deg,#f1edff,#fff);border:1px solid #e8e1fa;border-radius:19px;padding:17px;margin-bottom:15px}
.coach-intro h3{font-size:15px;margin:7px 0 4px}
.coach-intro p{font-size:11px;line-height:1.5;margin:0}
.notice{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}
.brand-panel{text-align:center;padding:18px 4px}
.brand-mark{width:68px;height:68px;border-radius:22px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 15px;font-size:22px;font-weight:850;letter-spacing:-.08em}
.brand-panel h2{font-size:26px;letter-spacing:-.06em;margin:0}
.brand-panel p{font-size:12px;line-height:1.6;color:var(--muted);max-width:390px;margin:10px auto 17px}
.empty-state{text-align:center;padding:25px 12px}
.empty-state h3{margin:0 0 7px}
.empty-state p{font-size:12px;color:var(--muted)}
.toast{position:fixed;z-index:150;bottom:100px;left:50%;transform:translate(-50%,15px);background:#17171c;color:#fff;padding:11px 16px;border-radius:999px;font-size:11px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* BIENVENIDA */
.welcome{min-height:100dvh;position:relative;overflow:hidden;background:#111;display:flex;align-items:flex-end;padding:clamp(24px,8vw,110px);color:#fff}
.welcome img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;opacity:.78}
.welcome:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.68),rgba(0,0,0,.12)),linear-gradient(0deg,rgba(0,0,0,.58),transparent 75%)}
.welcome-copy{position:relative;z-index:1;max-width:580px}
.welcome h1{font-size:clamp(39px,7vw,62px);line-height:1;letter-spacing:-.06em;margin:17px 0;font-weight:780}
.welcome p{font-size:14px;line-height:1.6;max-width:390px;color:#eee}
.name-screen{min-height:100dvh;display:grid;place-items:center;padding:22px}
.name-card{width:min(100%,490px);background:#fff;border:1px solid var(--line);border-radius:27px;padding:clamp(23px,6vw,42px);box-shadow:var(--shadow)}
.name-card h1{font-size:36px;line-height:1.05;letter-spacing:-.05em}

@media(max-width:900px){
  .plan-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plan-card:last-child{grid-column:1/-1}
}
@media(max-width:700px){
  .app-shell{padding:12px 14px calc(112px + env(safe-area-inset-bottom))}
  .app-top{margin-bottom:17px}
  .grid{grid-template-columns:1fr}
  .home-stat-grid{gap:7px}
  .home-stat-grid .card{padding:13px 11px}
  .home-stat-grid .stat{font-size:20px}
  .home-week{gap:4px}
  .home-week-day{padding:10px 1px;border-radius:11px}
  .home-week-day b{font-size:11px}
  .home-week-day small{font-size:8px}
  .home-hero{padding:20px}
  .home-actions>*{flex:1}
  .home-coach-card{align-items:flex-start;flex-direction:column}
  .home-coach-card .primary{width:100%}
  .session-list{grid-template-columns:1fr}
  .session-card{display:grid;grid-template-columns:105px minmax(0,1fr)}
  .session-card img{height:100%;min-height:132px}
  .session-content{padding:12px}
  .session-content .flex{align-items:flex-start;flex-direction:column}
  .session-content .pill{width:100%}
  .form-grid{grid-template-columns:1fr}
  .modal-backdrop{padding:10px;align-items:center}
  .modal-card{width:100%;max-height:88dvh;border-radius:22px;padding:18px}
  .training-modal-content{max-height:90dvh}
  .coach-modal{max-height:88dvh}
  .plan-list{grid-template-columns:1fr}
  .plan-card:last-child{grid-column:auto}
  .plan-card{padding:16px}
  .plan-card .primary{width:100%}
  .month-grid{gap:3px}
  .month-day,.month-day-empty{min-height:45px;border-radius:9px}
  .competition{gap:9px}
  .competition-date{width:46px;min-width:46px;height:49px}
  .competition-copy b{font-size:11px}
  .navbar{width:calc(100% - 18px);bottom:max(7px,env(safe-area-inset-bottom))}
  .navbar button{min-height:52px;font-size:8px}
  .welcome{padding:25px}
  .welcome img{object-position:55% center}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

<body>
<div id="screen"></div>
<nav id="footNav" class="navbar" hidden></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const SITE_URL='https://jooiin.github.io/Swimming/';
const COACH_URL='https://calendly.com/alancoach8/nueva-reunion';
const EVENTS_URL='https://granretto.com/proximos-eventos';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>iso(new Date());

function currentStreak(){
  const dates=[...new Set(state.completed.map(x=>x.date))].sort().reverse();
  if(!dates.length)return 0;
  let cursor=parseDate(dates[0]),today=parseDate(todayISO());
  if(iso(cursor)!==iso(today)&&iso(cursor)!==iso(addDays(today,-1)))return 0;
  let count=0;
  for(const d of dates){if(iso(parseDate(d))===iso(cursor)){count++;cursor=addDays(cursor,-1)}else break}
  return count;
}

/* CONTROL DEL CALENDARIO: MES ACTUAL Y SIGUIENTE */
function currentCalendarMonth(){
  const now=new Date();
  return new Date(now.getFullYear(),now.getMonth(),1);
}
function nextCalendarMonth(){
  const current=currentCalendarMonth();
  return new Date(current.getFullYear(),current.getMonth()+1,1);
}
function syncCalendarWindow(){
  const min=currentCalendarMonth();
  const max=nextCalendarMonth();
  const currentKey=iso(min).slice(0,7);
  const nextKey=iso(max).slice(0,7);
  const visibleKey=iso(calendarMonth).slice(0,7);

  if(visibleKey<currentKey)calendarMonth=min;
  if(visibleKey>nextKey)calendarMonth=max;

  const selectedMonth=selectedDate.slice(0,7);
  if(selectedMonth<currentKey)selectedDate=todayISO();
  if(selectedMonth>nextKey)selectedDate=iso(max);
}
function isAllowedCalendarMonth(date){
  const key=iso(date).slice(0,7);
  return key>=iso(currentCalendarMonth()).slice(0,7)&&
    key<=iso(nextCalendarMonth()).slice(0,7);
}
function weekdayIndex(date){
  return (parseDate(date).getDay()+6)%7;
}
function nextDateForDay(dayIndex){
  const today=parseDate(todayISO());
  const difference=(Number(dayIndex)-weekdayIndex(today)+7)%7;
  return iso(addDays(today,difference));
}

/* GENERADOR */
function randomItem(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function distanceText(m){return `${Number(m).toLocaleString('es-MX')} m`}
function zoneInfo(id){return zones.find(z=>z.id===id)||zones[1]}
function chooseDistance(target,min,max){
  const valid=distances.filter(x=>x>=min&&x<=max&&x<=target);
  return valid.length?randomItem(valid):min;
}

/* Asignación automática de intensidad */
function assignAutomaticZone(data){
  const goals=Array.isArray(data.goal)?data.goal:[data.goal];
  const levels=Array.isArray(data.level)?data.level:[data.level];
  const goal=goals.join(' ').toLowerCase();
  const level=levels.includes('Avanzado')?'Avanzado':levels.includes('Principiante')?'Principiante':'Intermedio';
  const distance=Number(data.distance)||1500;

  if(/velocidad|potencia/.test(goal))return level==='Avanzado'?'Zona 4':'Zona 3';
  if(/técnica/.test(goal))return 'Zona 2';
  if(/resistencia|fondo/.test(goal)){
    if(distance>=2500&&level!=='Principiante')return 'Zona 3';
    return 'Zona 2';
  }
  if(level==='Principiante')return 'Zona 1';
  if(level==='Avanzado')return 'Zona 3';
  return 'Zona 2';
}

function buildWorkout(data){
  const goal=randomItem(data.goal);
  const level=randomItem(data.level);
  const zoneId=assignAutomaticZone({...data,goal,level});
  const zone=zoneInfo(zoneId);
  const selectedStyles=data.styles.length?data.styles:['Crol'];
  const style=randomItem(selectedStyles);
  const chosenMaterials=data.materials.length?data.materials:['Sin material'];
  const material=randomItem(chosenMaterials);
  const totalTarget=Number(data.distance)||1500;

  const intensity={
    'Zona 1':'ritmo suave y cómodo',
    'Zona 2':'ritmo moderado y constante',
    'Zona 3':'velocidad media, manteniendo control técnico',
    'Zona 4':'ritmo intenso, con recuperación suficiente',
    'Zona 5':'esfuerzo máximo en repeticiones cortas'
  }[zoneId];

  const warmTarget=Math.max(100,Math.round(totalTarget*.18/25)*25);
  const previousTarget=Math.max(0,Math.round(totalTarget*.17/25)*25);
  const mainTarget=Math.max(100,totalTarget-warmTarget-previousTarget-Math.max(100,Math.round(totalTarget*.1/25)*25));
  const coolTarget=Math.max(100,totalTarget-warmTarget-previousTarget-mainTarget);

  const warmRep=chooseDistance(warmTarget,25,200);
  const warmCount=Math.max(1,Math.floor(warmTarget/warmRep));
  const previousRep=chooseDistance(previousTarget||100,25,150);
  const previousCount=Math.max(1,Math.floor((previousTarget||100)/previousRep));
  const mainRep=chooseDistance(mainTarget,50,600);
  const mainCount=Math.max(1,Math.floor(mainTarget/mainRep));
  const coolRep=chooseDistance(coolTarget,25,200);
  const coolCount=Math.max(1,Math.floor(coolTarget/coolRep));

  const warmMaterials=material==='Sin material'?'sin material':'con '+material.toLowerCase();
  const mainMaterials=material==='Sin material'?'sin material':'utilizando '+material.toLowerCase();

  const warmText=`${warmCount} × ${distanceText(warmRep)} de ${style.toLowerCase()}, ${intensity}. Enfócate en entrar en ritmo, respirar de forma continua y mantener una brazada cómoda. Realiza esta parte ${warmMaterials}.`;
  const previousText=`${previousCount} × ${distanceText(previousRep)} de trabajo técnico. Alterna atención en posición corporal, agarre y coordinación. Mantén pausas breves de 15 a 25 segundos entre repeticiones.`;
  let mainText;

  if(/velocidad|potencia/i.test(goal)){
    mainText=`${mainCount} × ${distanceText(mainRep)} de ${style.toLowerCase()} a ${intensity}. Acelera de forma controlada, conserva la alineación y recupera entre 20 y 40 segundos según la distancia. Realiza el bloque ${mainMaterials}.`;
  }else if(/técnica/i.test(goal)){
    mainText=`${mainCount} × ${distanceText(mainRep)} de ${style.toLowerCase()} priorizando eficiencia y coordinación. Mantén la intensidad ${zone.name.toLowerCase()} y descansa 20 segundos entre repeticiones.`;
  }else if(/fondo|resistencia/i.test(goal)){
    mainText=`${mainCount} × ${distanceText(mainRep)} de ${style.toLowerCase()} a ${intensity}. Busca continuidad, ritmo estable y respiración controlada. Descansa entre 20 y 35 segundos entre repeticiones.`;
  }else{
    mainText=`${mainCount} × ${distanceText(mainRep)} de ${style.toLowerCase()} a ${intensity}. Alterna tramos de ritmo constante con segmentos de atención técnica. Descansa de 20 a 30 segundos entre repeticiones.`;
  }

  const coolText=`${coolCount} × ${distanceText(coolRep)} muy suaves. Nada sin tensión, recupera la respiración y termina soltando hombros y piernas. Puedes alternar ${style.toLowerCase()} con dorso suave si tu nivel lo permite.`;
  const nameOptions={
    'Técnica':['Control de brazada','Alineación y coordinación','Eficiencia en el agua'],
    'Resistencia':['Base aeróbica','Continuidad y fondo','Resistencia progresiva'],
    'Velocidad':['Velocidad controlada','Aceleración y ritmo','Potencia en el agua'],
    'Preparación general':['Condición en el agua','Ritmo y resistencia','Sesión integral']
  };
  const title=randomItem(nameOptions[goal]||nameOptions['Preparación general']);

  return {
    id:uid(),title,category:goal.toUpperCase(),goal,level,style,material,
    distance:totalTarget,zone:zoneId,zoneName:zone.name,zoneDesc:zone.desc,
    trainingDay:Number(data.day),createdAt:new Date().toISOString(),date:'',
    sections:[
      {name:'CALENTAMIENTO',label:'01',distance:warmTarget,text:warmText},
      {name:'CIRCUITO PREVIO',label:'02',distance:previousTarget,text:previousText},
      {name:'CIRCUITO PRINCIPAL',label:'03',distance:mainTarget,text:mainText},
      {name:'AFLOJE',label:'04',distance:coolTarget,text:coolText}
    ]
  };
}

  if(!survey.goal.length||!survey.level.length||!survey.distance||!survey.styles.length||!survey.materials.length||!Number.isInteger(Number(survey.day))||Number(survey.day)<0||Number(survey.day)>6){
    showToast('Completa todas las opciones del entrenamiento.');return;
  }
  if(monthlyRemaining()<=0&&!isPremium()){showToast('Alcanzaste las siete generaciones de este mes.');return}

  const workout=buildWorkout({...survey,distance:Number(survey.distance)});
  state.workouts.unshift(workout);
  state.generations[monthKey()]=monthlyCount()+1;
  state.survey={...survey};save();
  openWorkoutModal(workout.id);
}

function openWorkoutModal(id){const w=getWorkout(id);if(!w)return;openModal(workoutModalMarkup(w),'workout')}
function shareText(w){
  const workoutDay=Number.isInteger(Number(w.trainingDay))?Number(w.trainingDay):0;
  return `NOVA SWIM · ${w.title}
${distanceText(w.distance)} · ${w.style}
Material: ${w.material}
Día de entrenamiento: ${weekDays[workoutDay].name}
Intensidad: ${w.zone} · ${w.zoneName}

CALENTAMIENTO
${w.sections[0].text}

CIRCUITO PREVIO
${w.sections[1].text}

CIRCUITO PRINCIPAL
${w.sections[2].text}

AFLOJE
${w.sections[3].text}

NOVA SWIM · ${SITE_URL}`;
}
async function shareWorkout(id){
  const w=getWorkout(id);if(!w)return;
  const text=shareText(w);
  if(navigator.share){try{await navigator.share({title:'NOVA SWIM · '+w.title,text});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(text);showToast('Entrenamiento copiado para compartir.')}
  catch{const field=document.createElement('textarea');field.value=text;document.body.appendChild(field);field.select();document.execCommand('copy');field.remove();showToast('Entrenamiento copiado.')}
}
function scheduleWorkout(id){
  const w=getWorkout(id),date=$('#workoutDate')?.value;
  if(!w||!date)return;
  if(date<todayISO()){showToast('Selecciona una fecha de hoy en adelante.');return}
  const workoutDay=Number.isInteger(Number(w.trainingDay))?Number(w.trainingDay):0;
  if(weekdayIndex(date)!==workoutDay){
    showToast(`Este entrenamiento corresponde al ${weekDays[workoutDay].name}.`);
    return;
  }
  const occupied=Object.entries(state.assignments).find(([key,value])=>key===date&&value!==id);
  if(occupied){if(!confirm('Ya tienes otro entrenamiento asignado ese día. ¿Quieres reemplazarlo?'))return;delete state.assignments[date]}
  if(w.date&&state.assignments[w.date]===id)delete state.assignments[w.date];
  w.date=date;state.assignments[date]=id;save();
  showToast('Entrenamiento programado.');openWorkoutModal(id);
}
function completeWorkout(id){
  const w=getWorkout(id);if(!w||isCompleted(id))return;
  state.completed.push({workoutId:id,date:todayISO(),completedAt:new Date().toISOString(),distance:w.distance,title:w.title,zone:w.zone});
  save();closeModal();tab='Progreso';render();showToast('Entrenamiento enviado a Progreso.');
}

/* CALENDARIO */
function monthCalendar(){
  const first=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1);
  const offset=(first.getDay()+6)%7,last=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,0).getDate();
  let html='';
  for(let i=0;i<42;i++){
    const day=i-offset+1;
    if(day<1||day>last){html+='<span class="month-day-empty"></span>';continue}
    const d=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),day),key=iso(d);
    const id=state.assignments[key],w=id?getWorkout(id):null;
    html+=`<button type="button" class="month-day ${key===selectedDate?'selected':''} ${key===todayISO()?'today':''} ${w?'assigned':''} ${w&&isCompleted(id)?'done':''}" data-date="${key}"><span>${day}</span>${w?'<i></i>':''}</button>`;
  }
  return html;
}

/* RENDER */
function render(){
  nav();
  const screen=$('#screen');
  if(screenMode==='welcome'){screen.innerHTML=welcome();return}
  if(screenMode==='name'){screen.innerHTML=nameScreen();return}
  let page='';
  if(tab==='Inicio')page=homePage();
  else if(tab==='Entrenar')page=trainingPage();
  else if(tab==='Calendario')page=calendarPage();
  else if(tab==='Progreso')page=statsPage();
  screen.innerHTML=`<div class="app-shell">${topBar()}${page}</div>`;
}

/* EVENTOS */
document.addEventListener('click',async e=>{
  const button=e.target.closest('button');if(!button)return;

  if(button.dataset.tab){
    closeModal();
    const destination=button.dataset.tab;
    if(destination==='Inicio')homeProfile=true;
    tab=destination;screenMode='app';navAnimation=destination;
    clearTimeout(navAnimationTimer);
    render();
    return;
  }

  if(button.dataset.surveyMulti){
    const key=button.dataset.surveyMulti,value=button.dataset.value;
    const arr=Array.isArray(survey[key])?[...survey[key]]:[];
    if(arr.includes(value))survey[key]=arr.filter(x=>x!==value);
    else survey[key]=[...arr,value];
    refreshSurveyModal();
    return;
  }

  if(button.dataset.surveySingle){
    const key=button.dataset.surveySingle;
    survey[key]=button.dataset.value;
    refreshSurveyModal();
    return;
  }

  if(button.dataset.surveyDay!==undefined){
    survey.day=Number(button.dataset.surveyDay);
    refreshSurveyModal();
    return;
  }

  if(button.dataset.workout){openWorkoutModal(button.dataset.workout);return}

  if(button.dataset.date){
    selectedDate=button.dataset.date;render();
    const id=state.assignments[selectedDate];
    if(id){const w=getWorkout(id);if(w)openWorkoutModal(id)}
    return;
  }

  switch(button.dataset.action){
    case'begin':screenMode='name';render();break;
    case'name-next':{
      const name=$('#athleteName')?.value.trim();
      if(!name){showToast('Escribe tu nombre para continuar.');return}
      state.name=name;state.planGenerated=true;save();
      screenMode='app';tab='Inicio';render();break;
    }
    case'brand-info':openBrandInfo();break;
    case'close-modal':closeModal();break;
    case'open-generator':
      closeModal();tab='Entrenar';render();openModal(surveyMarkup(),'generator');break;
    case'generate-workout':generateAndOpen();break;
    case'schedule-workout':scheduleWorkout(button.dataset.id);break;
    case'share-workout':shareWorkout(button.dataset.id);break;
    case'complete-workout':completeWorkout(button.dataset.id);break;
    case'month-prev':
      syncCalendarWindow();
      if(iso(calendarMonth).slice(0,7)!==iso(currentCalendarMonth()).slice(0,7)){
        calendarMonth=currentCalendarMonth();
        selectedDate=iso(calendarMonth);
      }
      render();break;
    case'month-next':
      syncCalendarWindow();
      if(iso(calendarMonth).slice(0,7)!==iso(nextCalendarMonth()).slice(0,7)){
        calendarMonth=nextCalendarMonth();
        selectedDate=iso(calendarMonth);
      }
      render();break;
    case'open-coach':openCoach();break;
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='workoutDate'){
    // La fecha se guarda únicamente al pulsar Guardar fecha.
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeModal)closeModal()});

if(state.planGenerated)screenMode='app';
else screenMode='welcome';
render();
</script>
</body>
</html>
