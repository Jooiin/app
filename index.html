/* AJUSTE VISUAL 04 · SF / APPLE */
:root{--ink:#17171c;--paper:#f7f6fb;--line:#e8e7ee;--muted:#85838d;--soft:#f1f0f6}
html,body,button,input,select,textarea{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;letter-spacing:-.018em}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.brand{font-size:22px;font-weight:750;letter-spacing:-.055em}
.brand small{font-size:8px;letter-spacing:.16em;font-weight:650}

.price{font-size:28px;font-weight:720;letter-spacing:-.045em}
.card{border-radius:23px;padding:20px;box-shadow:0 5px 22px rgba(35,31,55,.045)}
.session-list{gap:14px}
.session-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:13px;padding:12px;overflow:hidden}
.session-card .session-image-wrap{width:100%;min-width:0;overflow:hidden}
.session-card .training-image{display:block;width:100%;height:clamp(150px,22vw,220px);aspect-ratio:16/9;object-fit:cover;object-position:center;border-radius:16px;margin:0 0 13px;background:#e8e6ef}

.primary,.secondary,.pill{font-size:10px;font-weight:700;letter-spacing:.045em;padding:12px 18px}

.qicon{border-radius:16px}

<div id="screen"></div><nav id="footNav" class="navbar" hidden></nav>
<script>
const iconPaths={
Entrenamientos:'<path d="M2 7c3-3 5-3 8 0s5 3 8 0 4-3 4 0M2 13c3-3 5-3 8 0s5 3 8 0 4-3 4 0M2 19c3-3 5-3 8 0s5 3 8 0 4-3 4 0"/>',
Calendario:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
Estadisticas:'<path d="M4 20V11M9 20V6M14 20v-9M19 20V3"/>',
Coach:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
Perfil:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/>'
};
const tabs=Object.keys(iconPaths),svg=n=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[n]}</svg>`;
const initial={name:'',goal:'Mejorar resistencia',level:'Intermedio',availability:'',done:[],messages:[]};
let state;try{state={...initial,...JSON.parse(localStorage.getItem('nova_demo')||'{}')}}catch{state={...initial}}
if(!Array.isArray(state.done))state.done=[];
state.completedWorkouts=[...new Set([...(Array.isArray(state.completedWorkouts)?state.completedWorkouts:[]),...state.done])];
if(!state.records||typeof state.records!=='object')state.records={};
if(!state.completedAt||typeof state.completedAt!=='object')state.completedAt={};
let tab='Entrenamientos',screenMode=state.planGenerated?'app':'welcome',surveyStep=0,surveyData=state.survey||{},contactType='email';
let selectedDate=new Date();selectedDate.setHours(12,0,0,0);let calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
let coachInfo=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('nova_demo',JSON.stringify(state))}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseDate(k){return new Date(k+'T12:00:00')}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function sameDay(a,b){return iso(a)===iso(b)}
function startProgram(){if(!state.programStart){state.programStart=iso(new Date());state.trialStartedAt=Date.now();state.assignments={};const base=parseDate(state.programStart);[0,2,4,6,8,10,12].forEach((offset,i)=>state.assignments[iso(addDays(base,offset))]=i);save()}}
function assignments(){return state.assignments||(state.assignments={})}
function assignmentFor(d){let id=assignments()[iso(d)];return Number.isInteger(id)?workouts[id]:null}
function completedIds(){if(!Array.isArray(state.completedWorkouts))state.completedWorkouts=Array.isArray(state.done)?[...state.done]:[];return state.completedWorkouts}
function trialDays(){return Math.max(0,7-completedIds().length)}
function formatClock(seconds){if(!Number.isFinite(seconds)||seconds<0)return '—';let total=Math.round(seconds),m=Math.floor(total/60),s=total%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function parseClock(value){let parts=String(value||'').trim().split(':').map(Number);if(parts.length!==2||parts.some(x=>!Number.isFinite(x)||x<0)||parts[1]>=60)return null;return parts[0]*60+parts[1]}
function paceFor(workout,seconds){return formatClock(seconds/(workout.meters/100))}
function nextSession(){let done=completedIds(),entries=Object.entries(assignments()).filter(([date,id])=>!done.includes(id)).sort((a,b)=>a[0].localeCompare(b[0]));let today=iso(new Date());return entries.find(([date])=>date>=today)||entries[0]||null}
function isPremium(){return !!state.subscription?.active}
const workouts=[
{id:0,category:'TÉCNICA',title:'Técnica · Control y alineación',meters:700,week:1,warm:'200 m: 100 m crol suave + 4 × 25 m de deslizamiento, descansando 15 s.',main:'4 × 100 m crol a ritmo cómodo. En cada 100 m concéntrate en mantener la cabeza estable, entrada de mano al frente y exhalación continua bajo el agua. Descansa 20 s entre repeticiones.',cool:'100 m muy suave, alternando 25 m crol y 25 m espalda.',tips:'Prioriza la calidad del movimiento. Si pierdes la alineación, baja el ritmo.'},
{id:1,category:'RESISTENCIA',title:'Resistencia · Base aeróbica',meters:1500,week:1,warm:'300 m suaves: 200 m crol + 100 m espalda. Mantén respiración relajada.',main:'3 × 300 m a intensidad aeróbica constante (RPE 5–6/10), con 30 s de descanso. Busca completar los tres bloques al mismo ritmo, sin acelerar al inicio.',cool:'300 m suaves y continuos. Termina soltando hombros y piernas.',tips:'El objetivo es sostener el esfuerzo, no nadar al máximo.'},
{id:2,category:'FUERZA Y POTENCIA',title:'Fuerza y potencia · Aceleración',meters:1300,week:1,warm:'300 m: 200 m crol suave + 4 × 25 m progresivos, aumentando la velocidad sin perder técnica.',main:'8 × 50 m: 25 m fuertes + 25 m suaves, descansando 25 s. Después, 4 × 100 m con los primeros 25 m potentes y el resto controlado; descansa 30 s. Mantén una brazada firme y eficiente.',cool:'200 m muy suaves, sin forzar.',tips:'La potencia se trabaja con buena técnica. Detén la aceleración si se descompone la brazada.'},
{id:3,category:'TÉCNICA',title:'Técnica · Coordinación y respiración',meters:1000,week:1,warm:'200 m: 100 m crol + 100 m espalda, a ritmo suave.',main:'4 × 50 m de crol con respiración bilateral o patrón cómodo, descansando 15 s. Luego 4 × 100 m: 25 m punto muerto, 25 m crol completo, 25 m catch-up y 25 m crol completo. Descansa 20 s.',cool:'200 m suaves, concentrándote en soltar el aire dentro del agua.',tips:'Evita levantar la cabeza para respirar; gira el cuerpo junto con ella.'},
{id:4,category:'RESISTENCIA',title:'Resistencia · Continuidad',meters:2000,week:2,warm:'400 m suaves: 300 m crol + 100 m espalda.',main:'4 × 300 m a ritmo constante, descansando 30 s. Mantén el mismo número aproximado de brazadas por largo y una respiración estable. Finaliza con 4 × 50 m suaves con 15 s de pausa.',cool:'200 m muy suaves.',tips:'Controla el ritmo desde el primer 300; evita salir demasiado rápido.'},
{id:5,category:'FUERZA Y POTENCIA',title:'Fuerza y potencia · Ritmo de carrera',meters:1600,week:2,warm:'300 m suaves + 4 × 25 m progresivos (total 400 m).',main:'8 × 100 m alternando: impares a ritmo fuerte controlado y pares suaves, con 25 s de descanso. Después 4 × 50 m de patada con tabla o brazos extendidos, descansando 20 s.',cool:'200 m suaves.',tips:'En los tramos fuertes, conserva una brazada larga y estable. El material es opcional.'},
{id:6,category:'COMBINADO',title:'Combinado · Técnica, fondo y ritmo',meters:1600,week:2,warm:'300 m suaves: 200 m crol + 100 m espalda.',main:'3 × 200 m aeróbicos con 25 s de descanso. Continúa con 4 × 100 m alternando 50 m técnica + 50 m nado completo, con 20 s de descanso. Termina con 4 × 50 m progresivos, descansando 20 s.',cool:'100 m suaves.',tips:'Integra lo trabajado en las sesiones anteriores y termina con sensación de control.'}
];
const qs=[
{title:'¿Cuál es tu objetivo principal?',hint:'Elige el resultado que más te importa.',icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',type:'one',opts:['Mejorar mi condición física','Aprender o mejorar técnica','Aumentar resistencia','Preparar una competencia','Prepararme para aguas abiertas','Crear constancia y salud']},
{title:'¿Cuáles son tus objetivos de entrenamiento?',hint:'Puedes elegir más de uno.',icon:'<path d="M4 19V5M4 19h16M7 15l4-4 3 2 5-7"/>',type:'multi',max:5,opts:['Técnica','Resistencia','Velocidad','Fondo','Respiración','Ritmo','Aguas abiertas','Fuerza']},
{title:'Elige tu estilo de nado.',hint:'Selecciona el estilo que practicas o quieres trabajar.',icon:'<path d="M2 12c2.5-2 4.5-2 7 0s4.5 2 7 0 4.5-2 6 0M5 7l3-3 3 3M13 17l3 3 3-3"/>',type:'one',opts:['Crol / libre','Dorso','Pecho','Mariposa','Combinado','Todos los estilos']},
{title:'¿Cuál es tu distancia de nado promedio?',hint:'Desliza las opciones para elegir tu distancia habitual.',icon:'<path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/>',type:'roller',opts:['Aún no nado','Menos de 500 m','500–1,000 m','1,000–1,500 m','1,500–2,000 m','2,000–3,000 m','Más de 3,000 m']},
{title:'¿Qué aspectos técnicos te gustaría mejorar?',hint:'Elige máximo dos aspectos prioritarios.',icon:'<path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>',type:'multi',max:2,opts:['Respiración','Posición corporal','Brazada','Patada','Coordinación','Virajes','Salida','Ritmo de nado']},
{title:'¿Cuál es tu habilidad fuerte en natación?',hint:'Identifica lo que mejor se te da actualmente.',icon:'<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',type:'one',opts:['Resistencia','Velocidad','Técnica','Flotación y posición','Respiración','Orientación','Constancia','Aún no lo sé']},
{title:'¿Qué días sueles nadar?',hint:'Selecciona los días disponibles para entrenar.',icon:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',type:'multi',max:7,opts:['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo']},
{title:'¿Cuánto dura tu entrenamiento?',hint:'Si todavía no nadas, selecciona “Aún no entreno”.',icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',type:'one',opts:['Aún no entreno','30 minutos','45 minutos','60 minutos','75 minutos','90 minutos o más']},
{title:'¿Qué edad tienes y cuál es tu sexo?',hint:'Estos datos ayudan a contextualizar tu programación.',icon:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/>',type:'demographics'}
];;
function nav(){const n=document.getElementById('footNav');n.hidden=screenMode!=='app';n.innerHTML=screenMode==='app'?tabs.map(t=>`<button type="button" class="${t===tab?'active':''}" data-tab="${t}">${svg(t)}<span>${t}</span></button>`).join(''):''}
function welcome(){return `<section class="welcome"><div class="welcome-media"><img src="https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&w=2000&q=90" alt="Entrenamiento de natación"><img src="https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=2000&q=90" alt="Agua en movimiento"><img src="https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?auto=format&fit=crop&w=2000&q=90" alt="Alberca de natación"></div><div class="welcome-copy"><div class="welcome-mark">NOVA SWIM · TRAINING</div><h1>ENTRENA.<br>EVOLUCIONA.</h1><p>Tu entrenamiento, con dirección. Un plan creado alrededor de tus objetivos y tu ritmo.</p><button class="primary" data-action="begin">INICIO <span aria-hidden="true">→</span></button></div></section>`}
function nameScreen(){return `<section class="name-screen"><div class="name-card"><div class="eyebrow">NOVA SWIM · BIENVENIDO</div><h1>Primero,<br>¿cómo te llamas?</h1><p>Personalizamos tu espacio de entrenamiento desde el primer momento.</p><label class="field">Tu nombre<input id="athleteName" maxlength="40" placeholder="Escribe tu nombre" value="${esc(state.name)}" autocomplete="given-name"></label><button class="primary" style="margin-top:22px;width:100%" data-action="name-next">CONTINUAR →</button></div></section>`}
function choiceOptions(q,i){let val=surveyData[i],arr=Array.isArray(val)?val:val?[val]:[];return `<div class="${q.type==='roller'?'roller':'options'}">${q.opts.map(o=>`<button class="option ${arr.includes(o)?'selected':''}" data-choice="${esc(o)}" data-q="${i}">${o}</button>`).join('')}</div>`}
function survey(){let q=qs[surveyStep],value=surveyData[surveyStep];return `<main class="app-shell"><div class="question"><div class="flex"><span class="eyebrow">EVALUACIÓN INICIAL</span><span class="muted">${surveyStep+1} / 9</span></div><div class="progressline"><i style="width:${(surveyStep+1)/9*100}%"></i></div><div class="question-head"><div class="qicon"><svg viewBox="0 0 24 24">${q.icon}</svg></div><div><h2>${q.title}</h2><p>${q.hint}</p></div></div>${q.type==='demographics'?`<div class="formgrid"><label class="field">Edad<input id="age" type="number" min="5" max="100" placeholder="Tu edad" value="${esc(value?.age||'')}"></label><label class="field">Sexo<select id="sex"><option value="">Seleccionar</option>${['Mujer','Hombre','Prefiero no decirlo'].map(x=>`<option ${value?.sex===x?'selected':''}>${x}</option>`).join('')}</select></label></div>`:choiceOptions(q,surveyStep)}<div class="survey-actions"><button class="secondary" data-action="survey-back" ${surveyStep===0?'disabled':''}>← ANTERIOR</button><button class="primary" data-action="survey-next">${surveyStep===8?'CONTINUAR →':'SIGUIENTE →'}</button></div></div></main>`}
function contact(){return `<main class="app-shell"><div class="question"><div class="eyebrow">TU PLAN NOVA</div><h1>Tu punto de partida.</h1><p class="sub">Si quieres guardar tu plan y asociarlo a tus datos, deja un medio de contacto. Es opcional.</p><div class="card"><div class="flex"><h2>Guardar mi plan</h2><span class="tag">Opcional</span></div><div class="flex" style="margin:15px 0"><button class="pill" data-contact="email">EMAIL</button><button class="pill" data-contact="phone">TELÉFONO</button></div><label class="field">${contactType==='email'?'Correo electrónico':'Teléfono'}<input id="contactValue" type="${contactType==='email'?'email':'tel'}" placeholder="${contactType==='email'?'nombre@correo.com':'10 dígitos'}"></label><p class="muted">Puedes omitir este paso y continuar sin guardar un contacto.</p><div class="survey-actions"><button class="secondary" data-action="skip-contact">OMITIR</button><button class="primary" data-action="save-plan">GUARDAR PLAN →</button></div></div></div></main>`}
function validStep(){let v=surveyData[surveyStep];if(qs[surveyStep].type==='demographics'){let age=document.getElementById('age')?.value,sex=document.getElementById('sex')?.value;if(!age||Number(age)<5||Number(age)>100||!sex){alert('Completa tu edad y selecciona una opción de sexo.');return false}surveyData[surveyStep]={age:Number(age),sex};return true}if(!v||(Array.isArray(v)&&!v.length)){alert('Selecciona al menos una opción para continuar.');return false}return true}
function generatePlan(){state.survey=surveyData;state.planGenerated=true;state.goal=surveyData[0]||'Mejorar mi condición física';state.level=surveyData[3]==='Aún no nado'?'Principiante':surveyData[3]==='Más de 3,000 m'?'Avanzado':'Intermedio';state.availability=(surveyData[6]||[]).join(', ')||'Por definir';startProgram();save();screenMode='app';tab='Entrenamientos'}
function trainingPage(){
let daysLeft=trialDays(),done=completedIds(),next=nextSession(),completed=done.length,percent=Math.round(completed/workouts.length*100);
let nextHtml=next?(()=>{let [date,id]=next,w=workouts[id];return `<section class="section card"><div class="eyebrow">TU SIGUIENTE ENTRENAMIENTO</div><div class="next-session"><div class="next-session-copy"><h2 style="margin:8px 0 4px">${w.title}</h2><p>${w.meters.toLocaleString('es-MX')} m · ${parseDate(date).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'short'})}</p></div><button class="primary" data-workout="${id}">VER SESIÓN →</button></div></section>`})():'<section class="section card"><h2>Programa completado</h2><p>Has terminado las siete sesiones de este programa.</p></section>';
return `<div class="page"><div class="eyebrow">TU PROGRAMA · 14 DÍAS</div><h1>Entrenamientos.</h1><p class="sub">Tu plan organizado en dos semanas. Consulta tu semana, revisa la siguiente sesión y registra tu progreso.</p><section class="card week-overview"><div class="flex"><div><div class="eyebrow">PLANIFICACIÓN SEMANAL</div><h2 style="margin:5px 0 0">Esta semana</h2></div><span class="tag">${completed}/7 completadas</span></div>${weekCalendar()}</section>${nextHtml}<section class="section"><div class="flex"><h2>Tu progreso</h2><span class="tag">${percent}%</span></div><div class="progress-track"><i style="width:${percent}%"></i></div><div class="flex"><span class="muted">${completed} de ${workouts.length} sesiones completadas</span><span class="muted">${isPremium()?'Membresía activa':daysLeft+' días de prueba'}</span></div></section><div class="grid stats section"><div class="card"><span class="stat-card-label">SESIONES</span><div class="stat">${completed}/${workouts.length}</div><span class="stat-support">Entrenamientos completados</span></div><div class="card"><span class="stat-card-label">DISTANCIA PLANIFICADA</span><div class="stat">${(workouts.reduce((a,w)=>a+w.meters,0)/1000).toFixed(1)} km</div><span class="stat-support">En las siete sesiones</span></div><div class="card"><span class="stat-card-label">PROGRAMA</span><div class="stat">14 días</div><span class="stat-support">Dos semanas de trabajo</span></div></div>${workouts.slice(0,4).length?`<section class="section"><div class="flex"><h2>Semana 01</h2><span class="muted">Sesiones 01–04</span></div><div class="session-list">${workouts.slice(0,4).map(w=>sessionCard(w,false)).join('')}</div></section>`:''}<section class="section"><div class="flex"><h2>Semana 02</h2><span class="muted">Sesiones 05–07</span></div><div class="session-list">${workouts.slice(4).map(w=>sessionCard(w,false)).join('')}</div></section><p class="notice">Puedes mover cada sesión desde Calendario. Tus registros se guardan en este dispositivo.</p></div>`}
function sessionCard(w,locked){
let date=Object.keys(assignments()).find(k=>assignments()[k]===w.id),done=completedIds().includes(w.id),photos=['https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1560090995-01632a28895b?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1519315901367-f34ff9154487?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&w=1000&q=85','https://images.unsplash.com/photo-1502680390469-be75c86b636f?auto=format&fit=crop&w=1000&q=85'];
return `<article class="card session-card ${done?'is-complete':''}"><img class="training-image" src="${photos[w.id]}" alt="Entrenamiento de ${w.category.toLowerCase()}" loading="lazy"><div class="session-content"><div class="session-copy"><span class="eyebrow">${w.category}</span><h3>${w.title}</h3><p>${w.meters.toLocaleString('es-MX')} m</p><span class="session-status ${done?'complete':''}">${done?'COMPLETADO':date?parseDate(date).toLocaleDateString('es-MX',{day:'numeric',month:'short'}):'POR PROGRAMAR'}</span></div><button class="pill" data-workout="${w.id}" ${locked?'disabled':''}>${done?'REVISAR':'VER'}</button></div></article>`}
function workoutDetail(w){
if(!w)return `<div class="page"><button class="pill" data-action="back-training">← ENTRENAMIENTOS</button><section class="card"><h2>No encontramos esta sesión</h2></section></div>`;
let date=Object.keys(assignments()).find(k=>assignments()[k]===w.id)||state.programStart,choices=Array.from({length:14},(_,i)=>{let d=addDays(parseDate(state.programStart),i);return `<option value="${iso(d)}" ${date===iso(d)?'selected':''}>${d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'})}</option>`}).join(''),done=completedIds().includes(w.id),record=state.records[w.id],pace=record?paceFor(w,record.seconds):null;
return `<div class="page"><button class="pill" data-action="back-training">← ENTRENAMIENTOS</button><div class="eyebrow" style="margin-top:25px">${w.category} · ${w.week===1?'SEMANA 01':'SEMANA 02'}</div><h1>${w.title}</h1><p class="sub">${w.meters.toLocaleString('es-MX')} metros · Sesión ${w.id+1} de 7</p><div class="card"><div class="flex"><h2>Organiza tu sesión</h2><span class="tag">14 días</span></div><label class="field">Día asignado<select id="moveDate">${choices}</select></label><button class="secondary" style="margin-top:12px" data-action="move-workout" data-workout="${w.id}">GUARDAR FECHA</button></div><section class="section"><div class="blocks"><article class="block"><span class="eyebrow">01 · PREPARACIÓN</span><h3>Calentamiento</h3><p>${w.warm}</p></article><article class="block"><span class="eyebrow">02 · TRABAJO CENTRAL</span><h3>Serie principal</h3><p>${w.main}</p></article><article class="block"><span class="eyebrow">03 · RECUPERACIÓN</span><h3>Afloje</h3><p>${w.cool}</p></article></div></section><section class="section card"><h3>Indicaciones del coach</h3><p>${w.tips}</p><button class="primary" data-action="mark-workout" data-workout="${w.id}">${done?'✓ SESIÓN COMPLETADA · DESHACER':'MARCAR COMO COMPLETADA'}</button></section><section class="section card"><div class="eyebrow">REGISTRO DE RENDIMIENTO</div><h2 style="margin-top:7px">¿Cómo te fue?</h2><p>Registra el tiempo total de la sesión para calcular tu ritmo promedio por cada 100 metros.</p><div class="result-form"><label class="field">Tiempo total (mm:ss)<input id="resultTime" inputmode="numeric" placeholder="Ej. 32:45" value="${record?formatClock(record.seconds):''}"></label><button class="primary" data-action="save-result" data-workout="${w.id}">GUARDAR TIEMPO</button></div>${record?`<div class="result-summary"><div class="flex"><span class="muted">TU RESULTADO</span><strong>${formatClock(record.seconds)}</strong></div><div class="flex" style="margin-top:8px"><span class="muted">RITMO PROMEDIO / 100 M</span><strong>${pace}</strong></div>${record.note?`<p style="margin:8px 0 0">${esc(record.note)}</p>`:''}</div>`:''}</section></div>`}
function monthCalendar(){let first=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth(),1),offset=(first.getDay()+6)%7,start=addDays(first,-offset),today=new Date();today.setHours(12,0,0,0);let html='';for(let i=0;i<42;i++){let d=addDays(start,i),key=iso(d),w=assignmentFor(d),done=w&&completedIds().includes(w.id);html+=`<button class="month-day ${d.getMonth()!==calendarMonth.getMonth()?'outside':''} ${sameDay(d,selectedDate)?'selected':''} ${sameDay(d,today)?'today':''} ${w?'assigned':''} ${done?'done':''}" data-date="${key}"><span>${d.getDate()}</span>${w?'<i class="mini-dot"></i>':''}</button>`}return `<div class="month-grid">${['L','M','M','J','V','S','D'].map(x=>`<div class="month-head">${x}</div>`).join('')}${html}</div>`}
function weekCalendar(){let mondayDate=addDays(selectedDate,-((selectedDate.getDay()+6)%7)),today=new Date();today.setHours(12,0,0,0);return `<div class="week">${Array.from({length:7},(_,i)=>{let d=addDays(mondayDate,i),w=assignmentFor(d),done=w&&completedIds().includes(w.id);return `<button class="day ${sameDay(d,selectedDate)?'selected':''} ${sameDay(d,today)?'today':''} ${w?'assigned':''} ${done?'done':''}" data-date="${iso(d)}"><small>${['L','M','M','J','V','S','D'][i]}</small><strong>${d.getDate()}</strong>${w?'<span class="dot"></span>':''}</button>`}).join('')}</div>`}
function calendarPage(){let w=assignmentFor(selectedDate);return `<div class="page"><div class="eyebrow">PLANIFICACIÓN PERSONAL</div><h1>Calendario.</h1><p class="sub">Consulta tus sesiones programadas, selecciona una fecha y organiza tu plan.</p><section class="card"><div class="flex"><h2 style="text-transform:capitalize">${calendarMonth.toLocaleDateString('es-MX',{month:'long',year:'numeric'})}</h2><div><button class="pill" data-action="month-prev">←</button> <button class="pill" data-action="month-today">HOY</button> <button class="pill" data-action="month-next">→</button></div></div>${monthCalendar()}<div class="calendar-legend"><span class="muted"><i></i> Programada</span><span class="muted"><i class="done-dot"></i> Completada</span></div></section><section class="section card"><div class="eyebrow">${selectedDate.toLocaleDateString('es-MX',{dateStyle:'full'})}</div>${w?`<h2 style="margin-top:12px">${w.title}</h2><p>${w.meters.toLocaleString('es-MX')} m · ${w.category} · ${completedIds().includes(w.id)?'Completada':'Programada'}</p><button class="primary" data-workout="${w.id}">VER ENTRENAMIENTO →</button>`:`<h2 style="margin-top:12px">Día libre</h2><p>No tienes una sesión asignada. Puedes mover aquí cualquiera de tus siete entrenamientos.</p>`}<div class="section"><label class="field">Acomodar entrenamiento en este día<select id="assignWorkout"><option value="">Selecciona una sesión</option>${workouts.map(x=>`<option value="${x.id}">${x.id+1}. ${x.title}</option>`).join('')}</select></label><button class="secondary" style="margin-top:12px" data-action="assign-date">ASIGNAR A ESTE DÍA</button></div></section></div>`}
function statsPage(){let done=completedIds(),meters=done.reduce((sum,id)=>sum+(workouts[id]?.meters||0),0),records=done.map(id=>({id,record:state.records[id]})).filter(x=>x.record),avg=records.length?records.reduce((s,x)=>s+x.record.seconds/(workouts[x.id].meters/100),0)/records.length:null,percent=Math.round(done.length/workouts.length*100);return `<div class="page"><div class="eyebrow">CONSISTENCIA Y RENDIMIENTO</div><h1>Estadísticas.</h1><p class="sub">Una lectura de tu constancia, distancia y tiempos registrados.</p><div class="grid stats"><div class="card"><span class="stat-card-label">SESIONES</span><div class="stat">${done.length}</div><span class="stat-support">De ${workouts.length} programadas</span></div><div class="card"><span class="stat-card-label">DISTANCIA</span><div class="stat">${(meters/1000).toFixed(2)} km</div><span class="stat-support">Metros completados</span></div><div class="card"><span class="stat-card-label">CUMPLIMIENTO</span><div class="stat">${percent}%</div><span class="stat-support">Avance del programa</span></div><div class="card"><span class="stat-card-label">RITMO PROMEDIO</span><div class="stat">${avg===null?'—':formatClock(avg)}</div><span class="stat-support">Por cada 100 m · ${records.length} registros</span></div></div><section class="section card"><div class="flex"><h2>Progreso del programa</h2><span class="tag">${done.length}/7</span></div><div class="progress-track"><i style="width:${percent}%"></i></div><p>${percent===100?'Programa completado. Excelente constancia.':`Te faltan ${workouts.length-done.length} sesiones para completar este programa.`}</p></section><section class="section card"><h2>Historial de entrenamientos</h2>${done.length?done.map(id=>{let w=workouts[id],r=state.records[id];return `<div class="history-row"><div><b>${w.title}</b><small>${w.meters.toLocaleString('es-MX')} m · ${state.completedAt[id]||'Completada'}</small></div><div style="text-align:right"><b>${r?formatClock(r.seconds):'—'}</b><small>${r?'Ritmo '+paceFor(w,r.seconds)+'/100 m':'Sin tiempo registrado'}</small></div></div>`}).join(''):'<p>Aún no hay sesiones completadas. Marca una sesión como completada para comenzar tu historial.</p>'}</section><section class="section card"><h2>Tu punto de partida</h2><p><b>Objetivo:</b> ${esc(state.goal)}</p><p><b>Nivel:</b> ${esc(state.level)}</p><p><b>Días disponibles:</b> ${esc(state.availability)}</p></section></div>`}
function coachPage(){return `<div class="page"><div class="coach-top"><div><div class="eyebrow">ACOMPAÑAMIENTO</div><h1 style="margin-bottom:0">Coach.</h1></div><button class="round-icon" data-action="coach-info" aria-label="Abrir centro de ayuda"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.4 1.6c-1.1 1-2 1.3-2 3M12 17h.01"/></svg></button></div><section class="card"><div class="eyebrow">MEMBRESÍAS NOVA SWIM</div><h2 style="margin-top:10px">Elige cómo quieres entrenar.</h2><p>Continúa tu proceso con acompañamiento y planificación.</p><div class="plans" style="margin-top:18px">${[['BASE','$999','Natación','Para construir técnica y constancia.'],['RENDIMIENTO','$1,499','Natación','Planificación para avanzar hacia tus objetivos deportivos.'],['FUERZA','$499','Fuera del agua','Trabajo físico complementario.']].map(([n,p,t,d])=>`<article class="card plan-card ${n==='RENDIMIENTO'?'recommended':''}"><div class="eyebrow">${n==='RENDIMIENTO'?'RECOMENDADO':'PLAN NOVA'}</div><h2 style="margin-top:12px">${n}</h2><div class="price">${p}<small> MXN / mes</small></div><span class="tag">${t}</span><p>${d}</p><button class="primary" data-action="contact-coach">CONSULTAR</button></article>`).join('')}</div><p class="notice">La activación y el pago se coordinan directamente con el coach.</p><div class="coach-intro"><div class="coach-avatar">A</div><div><div class="eyebrow">TU ENTRENADOR</div><b>Coach Alan</b><p style="margin:4px 0 0">Acompañamiento y orientación para dar dirección a tu entrenamiento.</p></div></div><div class="section"><div class="eyebrow">¿QUIERES HABLAR CON ALAN?</div><a class="primary" style="display:inline-flex;text-decoration:none;margin-top:10px" href="https://calendly.com/alancoach8/nueva-reunion" target="_blank" rel="noopener">AGENDAR UNA SESIÓN ↗</a></div></section></div>`}
function coachKnowledge(){let mode=window._knowledgeTab||'faq';if(mode==='method')return `<h3>Menos improvisación. Más dirección.</h3><p>El plan parte de tu nivel, tus objetivos y el tiempo que tienes para entrenar. Cada sesión tiene una intención: mejorar técnica, desarrollar resistencia o trabajar ritmos.</p><div class="faq-item"><b>Evaluación inicial</b><p>Identificamos nivel, objetivos, tiempo disponible y necesidades para establecer prioridades realistas.</p></div><div class="faq-item"><b>Sesiones con intención</b><p>Organizamos técnica, distancias, ritmos, descansos y progresión para que cada entrenamiento tenga una finalidad.</p></div><div class="faq-item"><b>Progresión</b><p>El volumen y la intensidad se distribuyen para construir capacidad sin perder de vista la calidad técnica.</p></div>`;if(mode==='process')return `<h3>Conozco · Diseño · Ajusto</h3><div class="faq-item"><b>01 · Conozco tu punto de partida</b><p>Reviso tus objetivos, experiencia, disponibilidad y entrenamiento actual.</p></div><div class="faq-item"><b>02 · Diseño tu programa</b><p>Preparo sesiones según tu nivel y meta deportiva.</p></div><div class="faq-item"><b>03 · Ajusto tu proceso</b><p>Tus sensaciones, resultados y constancia orientan los ajustes de volumen, intensidad y planificación.</p></div>`;return `<div class="faq-item"><b>¿Cómo funcionan los primeros 7 días?</b><p>Tienes acceso inicial a siete sesiones organizadas en dos semanas. Puedes acomodar sus fechas desde el calendario.</p></div><div class="faq-item"><b>¿Puedo cambiar los días de entrenamiento?</b><p>Sí. En Calendario elige una fecha y asigna una de las sesiones disponibles.</p></div><div class="faq-item"><b>¿Qué incluye una sesión?</b><p>Calentamiento, serie principal, afloje e indicaciones para ejecutar el trabajo.</p></div><div class="faq-item"><b>¿Cómo registro mis resultados?</b><p>Abre una sesión, marca si la completaste y registra tu tiempo total. NOVA calculará tu ritmo promedio por cada 100 metros.</p></div><div class="faq-item"><b>¿Cómo continúo después de la prueba?</b><p>Consulta los planes NOVA en la sección Coach para revisar la membresía que corresponde a tus objetivos.</p></div>`}
function coachPlans(){return `<section class="card"><div class="eyebrow">MEMBRESÍAS NOVA SWIM</div><h2 style="margin-top:10px">Elige cómo quieres entrenar.</h2><p>Continúa tu proceso con acompañamiento y planificación.</p><div class="plans" style="margin-top:18px">${[['BASE','$999','Natación','Para construir técnica y constancia.'],['RENDIMIENTO','$1,499','Natación','Planificación para avanzar hacia tus objetivos deportivos.'],['FUERZA','$499','Fuera del agua','Trabajo físico complementario.']].map(([n,p,t,d])=>`<article class="card plan-card ${n==='RENDIMIENTO'?'recommended':''}"><div class="eyebrow">${n==='RENDIMIENTO'?'RECOMENDADO':'PLAN NOVA'}</div><h2 style="margin-top:12px">${n}</h2><div class="price">${p}<small> MXN / mes</small></div><span class="tag">${t}</span><p>${d}</p><button class="primary" data-action="contact-coach">CONSULTAR</button></article>`).join('')}</div><p class="notice">La activación y el pago se coordinan directamente con el coach.</p></section>`}
function coachChat(){return `<section class="card"><div class="eyebrow">ACOMPAÑAMIENTO PERSONAL</div><h2 style="margin-top:10px">Agenda una sesión con tu coach.</h2><p>Conoce tu punto de partida, resuelve tus dudas y define el siguiente paso de tu entrenamiento.</p><a class="primary" style="display:inline-flex;text-decoration:none;margin-top:15px" href="https://calendly.com/alancoach8/nueva-reunion" target="_blank" rel="noopener">ABRIR CALENDLY ↗</a></section>`}
function profilePage(){return `<div class="page"><div class="eyebrow">TU CUENTA</div><h1>Perfil.</h1><p class="sub">Tu información personal, objetivos y preferencias de entrenamiento.</p><section class="card"><div class="flex"><div><div class="eyebrow">ATLETA NOVA</div><h2 style="margin-top:8px">${esc(state.name||'Atleta')}</h2><p>${esc(state.goal)} · ${esc(state.level)}</p></div><div class="qicon"><svg viewBox="0 0 24 24">${iconPaths.Perfil}</svg></div></div><div class="profile-form"><label class="field">NOMBRE<input id="profileName" maxlength="40" value="${esc(state.name||'')}"></label><label class="field">OBJETIVO<select id="profileGoal">${['Mejorar mi condición física','Aprender o mejorar técnica','Aumentar resistencia','Preparar una competencia','Prepararme para aguas abiertas','Crear constancia y salud'].map(x=>`<option ${state.goal===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">NIVEL<select id="profileLevel">${['Principiante','Intermedio','Avanzado'].map(x=>`<option ${state.level===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">DISPONIBILIDAD<input id="profileAvailability" value="${esc(state.availability||'')}" placeholder="Ej. Lunes, miércoles y viernes"></label></div><div class="profile-actions"><button class="primary" data-action="save-profile">GUARDAR CAMBIOS</button><button class="secondary" data-action="reset-survey">REHACER EVALUACIÓN</button></div></section><section class="section card"><div class="eyebrow">TU MEMBRESÍA</div><h2 style="margin-top:8px">${isPremium()?'Membresía activa':'Sin membresía activa'}</h2><p>${isPremium()?'Tu acceso de entrenamiento está activo.':'Puedes revisar los planes disponibles y consultar directamente con Coach Alan.'}</p><button class="secondary" data-tab="Coach">VER MEMBRESÍAS →</button></section><section class="section card"><div class="eyebrow">PREFERENCIAS</div><h2 style="margin-top:8px">Tu estilo de nado</h2><p>${esc(state.survey?.[2]||'Aún no definido')}</p><div class="training-row"><span class="muted">EDAD</span><b>${esc(state.survey?.[8]?.age||'—')}</b></div><div class="training-row"><span class="muted">DISTANCIA HABITUAL</span><b>${esc(state.survey?.[3]||'—')}</b></div><div class="training-row"><span class="muted">DISPONIBILIDAD</span><b>${esc(state.availability||'—')}</b></div></section><p class="notice">Tus datos y registros actuales se guardan localmente en este dispositivo.</p></div>`}
function helpModal(){if(!coachInfo)return '';let mode=window._knowledgeTab||'faq';return `<div class="modal-backdrop" data-help-backdrop><section class="modal-card help-modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle"><div class="help-modal-head"><div><div class="eyebrow">NOVA SWIM · GUÍA</div><h2 id="helpTitle">Centro de ayuda</h2><p>Resuelve tus dudas y conoce cómo trabajamos.</p></div><button class="round-icon" data-action="coach-info-close" aria-label="Cerrar">×</button></div><div class="coach-tabs"><button class="pill ${mode==='faq'?'active':''}" data-action="faq-tab">FAQS</button><button class="pill ${mode==='method'?'active':''}" data-action="method-tab">MÉTODO</button><button class="pill ${mode==='process'?'active':''}" data-action="process-tab">PROCESO</button></div><div class="help-content">${coachKnowledge()}</div></section></div>`}
function render(){nav();let body;if(screenMode==='welcome')body=welcome();else if(screenMode==='name')body=nameScreen();else if(screenMode==='survey')body=survey();else if(screenMode==='contact')body=contact();else{let page=tab==='Entrenamientos'?trainingPage():tab==='Calendario'?calendarPage():tab==='Estadisticas'?statsPage():tab==='Coach'?coachPage():profilePage();body=`<div class="app-shell">${page}</div>`}document.getElementById('screen').innerHTML=body+helpModal()}
function selectChoice(button){let i=Number(button.dataset.q),q=qs[i],v=button.dataset.choice,current=surveyData[i];if(q.type==='multi'){let arr=Array.isArray(current)?[...current]:[];if(arr.includes(v))arr=arr.filter(x=>x!==v);else if(arr.length<(q.max||10))arr.push(v);surveyData[i]=arr}else surveyData[i]=v;render()}
document.addEventListener('click',e=>{if(e.target.matches('[data-help-backdrop]')){coachInfo=false;render();return}let b=e.target.closest('button');if(!b)return;
if(b.dataset.choice!==undefined){selectChoice(b);return}
if(b.dataset.tab){if(screenMode!=='app')return;tab=b.dataset.tab;if(tab==='Coach'){coachInfo=false;window._knowledgeTab='faq'}render();return}
if(b.dataset.workout!==undefined){let w=workouts[Number(b.dataset.workout)];if(w){screenMode='detail';window._detailWorkout=w.id;renderDetail()}return}
if(b.dataset.date){selectedDate=parseDate(b.dataset.date);calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);render();return}
if(b.dataset.contact){contactType=b.dataset.contact;render();return}
switch(b.dataset.action){
case'begin':screenMode='name';render();break;
case'name-next':{let n=document.getElementById('athleteName')?.value.trim();if(!n){alert('Escribe tu nombre para continuar.');return}state.name=n;save();screenMode='survey';surveyStep=0;render();break}
case'survey-back':if(surveyStep>0)surveyStep--;render();break;
case'survey-next':if(!validStep())return;if(surveyStep<8){surveyStep++;render()}else{screenMode='contact';render()}break;
case'skip-contact':generatePlan();render();break;
case'save-plan':{let val=document.getElementById('contactValue')?.value.trim();if(val)state.contact={type:contactType,value:val};generatePlan();render();break}
case'month-prev':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);render();break;
case'month-next':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);render();break;
case'month-today':selectedDate=new Date();selectedDate.setHours(12,0,0,0);calendarMonth=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);render();break;
case'assign-date':{let id=document.getElementById('assignWorkout')?.value;if(id===''){alert('Selecciona un entrenamiento.');return}let a=assignments();Object.keys(a).forEach(k=>{if(a[k]===Number(id))delete a[k]});a[iso(selectedDate)]=Number(id);save();render();break}
case'move-workout':{let id=Number(b.dataset.workout),newDate=document.getElementById('moveDate')?.value;if(!newDate)return;let a=assignments(),oldDate=Object.keys(a).find(k=>a[k]===id),displaced=a[newDate];if(oldDate)delete a[oldDate];a[newDate]=id;if(displaced!==undefined&&oldDate&&oldDate!==newDate)a[oldDate]=displaced;save();selectedDate=parseDate(newDate);screenMode='detail';renderDetail();break}
case'back-training':screenMode='app';tab='Entrenamientos';render();break;
case'mark-workout':{let id=Number(b.dataset.workout),list=completedIds();if(list.includes(id)){state.completedWorkouts=list.filter(x=>x!==id);delete state.completedAt[id]}else{state.completedWorkouts=[...list,id];state.completedAt[id]=new Date().toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}state.done=[...state.completedWorkouts];save();renderDetail();break}
case'save-result':{let id=Number(b.dataset.workout),seconds=parseClock(document.getElementById('resultTime')?.value);if(seconds===null||seconds<=0){alert('Escribe el tiempo en formato mm:ss.');return}state.records=state.records||{};state.records[id]={seconds,savedAt:new Date().toISOString()};save();renderDetail();break}
case'save-profile':{let name=document.getElementById('profileName')?.value.trim();if(!name){alert('Escribe tu nombre.');return}state.name=name;state.goal=document.getElementById('profileGoal')?.value||state.goal;state.level=document.getElementById('profileLevel')?.value||state.level;state.availability=document.getElementById('profileAvailability')?.value.trim()||'Por definir';save();render();break}
case'reset-survey':if(confirm('¿Quieres rehacer tu evaluación inicial? Se conservarán tus sesiones completadas y tiempos registrados.')){state.planGenerated=false;state.survey={};surveyData={};surveyStep=0;screenMode='survey';save();render()}break
case'coach-info':coachInfo=!coachInfo;render();break;
case'coach-info-close':coachInfo=false;render();break;
case'faq-tab':window._knowledgeTab='faq';render();break;
case'method-tab':window._knowledgeTab='method';render();break;
case'process-tab':window._knowledgeTab='process';render();break;
case'coach-chat':coachPanel=false;coachInfo=false;render();break;
case'coach-plans':coachPanel=true;coachInfo=false;render();break;
case'send-chat':{let msg=document.getElementById('coachMessage')?.value.trim();if(msg){state.messages=state.messages||[];state.messages.push(msg);save();render()}break}
case'contact-coach':window.open('https://calendly.com/alancoach8/nueva-reunion','_blank','noopener');break;
case'back-to-app':screenMode='app';tab='Entrenamientos';render();break;
}
});
function renderDetail(){nav();let id=window._detailWorkout,body=`<div class="app-shell">${workoutDetail(workouts[id])}</div>`;document.getElementById('screen').innerHTML=body+helpModal()}
function validStep(){let v=surveyData[surveyStep];if(qs[surveyStep].type==='demographics'){let age=document.getElementById('age')?.value,sex=document.getElementById('sex')?.value;if(!age||Number(age)<5||Number(age)>100||!sex){alert('Completa tu edad y selecciona una opción.');return false}surveyData[surveyStep]={age:Number(age),sex};return true}if(!v||(Array.isArray(v)&&!v.length)){alert('Selecciona al menos una opción para continuar.');return false}return true}
if(state.planGenerated&&!state.programStart)startProgram();
render();
</script>
</body>
</html>
